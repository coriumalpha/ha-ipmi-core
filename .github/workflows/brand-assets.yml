name: Render IPMI Core brand (private release preparation)

on:
  push:
    branches: [release/hacs-custom-0.1.7]
    paths:
      - "assets/ipmi-core-icon.svg"
      - ".github/workflows/brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.ref == 'refs/heads/release/hacs-custom-0.1.7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned renderer dependencies
        run: python -m pip install "CairoSVG==2.8.2" "Pillow==11.3.0"
      - name: Regenerate and commit PNGs on release branch only
        run: |
          python scripts/render_brand.py
          git add custom_components/ipmi_core/brand/icon.png custom_components/ipmi_core/brand/icon@2x.png
          if git diff --cached --quiet; then
            echo "Generated assets match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate brand icons for release"
          git push origin "HEAD:${GITHUB_REF_NAME}"
