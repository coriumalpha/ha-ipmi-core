name: Validate IPMI Core brand assets

on:
  push:
    paths:
      - "assets/ipmi-core-icon.svg"
      - "scripts/render_brand.py"
      - ".github/workflows/brand-assets.yml"
      - "custom_components/ipmi_core/brand/**"
  pull_request:
    paths:
      - "assets/ipmi-core-icon.svg"
      - "scripts/render_brand.py"
      - ".github/workflows/brand-assets.yml"
      - "custom_components/ipmi_core/brand/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned renderer dependencies
        run: python -m pip install "CairoSVG==2.8.2" "Pillow==11.3.0"
      - name: Verify committed brand assets match source
        run: |
          python scripts/render_brand.py
          git diff --exit-code -- custom_components/ipmi_core/brand/icon.png custom_components/ipmi_core/brand/icon@2x.png
